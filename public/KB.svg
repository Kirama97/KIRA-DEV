<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <style>
      .bg { fill: #09090b; }
      .border { stroke: #27272a; stroke-width: 2; }
      .text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 26px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .dot { fill: #10b981; }
    </style>
  </defs>
  <!-- Background with subtle border -->
  <rect class="bg border" x="1" y="1" width="62" height="62" rx="16"/>
  
  <!-- Monogram DT -->
  <text class="text" x="29" y="41" text-anchor="middle">DT</text>
  
  <!-- Live status dot -->
  <circle class="dot" cx="48" cy="39" r="3.5"/>
</svg>
